name: Build and Test Vyay

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Parser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (Golden Parser Suite)
        run: ./gradlew test --stacktrace

  build-debug:
    name: Build APK & Publish Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version & Tag
        id: versioning
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="0.2.0-beta"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Version: ${VERSION}, Release Tag: ${TAG}"

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/vyay-app.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/vyay-v${VERSION}.apk"
          cd release_assets
          sha256sum vyay-app.apk > sha256.txt
          sha256sum "vyay-v${VERSION}.apk" >> sha256.txt
          echo "SHA256 Checksums:"
          cat sha256.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyay-app-apk
          path: release_assets/vyay-app.apk

      - name: Publish GitHub Release (Preserve All Versions)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Vyay (व्यय) ${{ steps.versioning.outputs.tag }}"
          body: |
            ## Vyay (व्यय) ${{ steps.versioning.outputs.tag }}
            
            This release represents Phase 1: Core Accounting, Sovereign Offline Backup, and Editorial UX Polish.

            ### What's New & Tested in this Version:
            - **Anchor Balance Math:** Today's reconciled bank balance is the definitive anchor ($t_0$). SMS scans move backward and past transactions do not alter today's starting balance.
            - **Zero-Interrogation Onboarding:** Removed onboarding questionnaires and timeframe inquiries; the app opens directly to the dashboard.
            - **Credit Card Bill Double-Counting Elimination:** Bill settlements from bank accounts are classified as internal transfers (`BILL_PAYMENT`), excluded from monthly expenditure and reducing card dues.
            - **Real Sovereign 12-Word Ledger Key:** AES-256-GCM encrypted snapshot backup of all accounts, cards, transactions, and categories with 12-word restore capability.
            - **Dashboard Total Net Balance Card & Translucent ₹ Watermark:** Real-time net balance (Banks minus Card dues) with the signature translucent Rupee watermark.
            - **Manual Account & Card Manager:** Effortlessly add and edit bank balances (Federal, HDFC, SBI, ICICI, etc.) and credit card limits directly from the dashboard.
            - **Broad Category Matching:** Fixed emoji category lookup bug ensuring transactions are classified into broad categories.
            - **Zero Internet Guarantee:** Offline sovereign architecture with 0 KB internet permission.
            
            ### Downloads:
            - **Standard APK:** [`vyay-app.apk`](https://github.com/dot-wasim/Vyay/releases/download/${{ steps.versioning.outputs.tag }}/vyay-app.apk)
            - **Versioned Archive APK:** [`vyay-v${{ steps.versioning.outputs.version }}.apk`](https://github.com/dot-wasim/Vyay/releases/download/${{ steps.versioning.outputs.tag }}/vyay-v${{ steps.versioning.outputs.version }}.apk)
            
            *See all previous versions in [Releases](https://github.com/dot-wasim/Vyay/releases) or read our full [CHANGELOG.md](https://github.com/dot-wasim/Vyay/blob/main/CHANGELOG.md).*
          files: |
            release_assets/vyay-app.apk
            release_assets/vyay-*.apk
            release_assets/sha256.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
