name: Build and Test Vyay

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Parser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (Golden Parser Suite)
        run: ./gradlew test --stacktrace

  build-debug:
    name: Build APK & Publish Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version & Tag
        id: versioning
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="0.1.2-alpha"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Version: ${VERSION}, Release Tag: ${TAG}"

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Files
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/vyay-app.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/vyay-v${VERSION}.apk"
          cd release_assets
          sha256sum vyay-app.apk > sha256.txt
          sha256sum "vyay-v${VERSION}.apk" >> sha256.txt
          echo "SHA256 Checksums:"
          cat sha256.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyay-app-apk
          path: release_assets/vyay-app.apk

      - name: Publish GitHub Release (Preserve All Versions)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Vyay (व्यय) ${{ steps.versioning.outputs.tag }}"
          body: |
            ## Vyay (व्यय) ${{ steps.versioning.outputs.tag }}
            
            This release is part of our transparent build iteration history. Every version tested in real life is preserved here so you can trace every trial and improvement.

            ### What's New & Tested in this Version:
            - **Exact Decimal Amount Parsing:** Fixed greedy 3-digit regex bug (e.g. ₹1336.05 detected accurately instead of 136).
            - **Reference Number Deduplication:** UPI Ref / RRN / UTR numbers are now used as definitive ground truth. Duplicate SMS alerts are safely ignored while distinct sequential payments (e.g., two ₹1,000 debits) are both preserved.
            - **Merchant Normalization:** Truncated bank SMS strings like `Indian Rail W` are cleaned to `Indian Railway 🚂`.
            - **Fun Mode for Food & Entertainment:** Added lively emojis (`Food & Treats 🍕🍔`, `Entertainment & Fun 🍿🎬`) and merchant nuances.
            - **Non-destructive Migration:** Existing database categories are preserved with automated upgrade in `VyayahDatabase.onOpen`.
            - **Zero Internet Guarantee:** Manifest continues to have 0 KB internet permission.
            
            ### Downloads:
            - **Standard APK:** [`vyay-app.apk`](https://github.com/dot-wasim/Vyay/releases/download/${{ steps.versioning.outputs.tag }}/vyay-app.apk)
            - **Versioned Archive APK:** [`vyay-v${{ steps.versioning.outputs.version }}.apk`](https://github.com/dot-wasim/Vyay/releases/download/${{ steps.versioning.outputs.tag }}/vyay-v${{ steps.versioning.outputs.version }}.apk)
            
            *See all previous versions in [Releases](https://github.com/dot-wasim/Vyay/releases) or read our full [CHANGELOG.md](https://github.com/dot-wasim/Vyay/blob/main/CHANGELOG.md).*
          files: |
            release_assets/vyay-app.apk
            release_assets/vyay-*.apk
            release_assets/sha256.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
